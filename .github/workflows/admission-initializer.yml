name: Admission Initializer upgrade integration

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      scenario:
        description: Scenario to diagnose; PR checks always run all five
        type: choice
        required: true
        default: all
        options: [all, upgrade, fresh, operational, ocl-fresh, ocl-upgrade]

permissions:
  contents: read

jobs:
  initializer-upgrade:
    name: Initializer (${{ matrix.scenario }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.scenario && inputs.scenario != 'all' && format('["{0}"]', inputs.scenario) || '["upgrade","fresh","operational","ocl-fresh","ocl-upgrade"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch only the fixed content baselines
        run: |
          git fetch --no-tags --depth=1 origin \
            8000b27f48bf124fe9a553d4ba41c678e9acc231 \
            762920145a806f989fd8876ab2938ef217f57aab \
            b9e93638fd7ed9c8dffe8b48f2be868f3d9b1a10
      - name: Test the harness isolation and assertions without Docker
        run: python3 -B .github/integration/admission-initializer/test_harness.py
      - name: Exercise the pinned backend with exclusively synthetic data
        env:
          ADMISSION_INITIALIZER_DISPOSABLE: github-runner-only
          ADMISSION_INITIALIZER_SCENARIO: ${{ matrix.scenario }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B .github/integration/admission-initializer/harness.py \
            | tee admission-initializer-result.jsonl
      - name: Preserve only sanitized phase results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admission-initializer-${{ matrix.scenario }}-${{ github.sha }}
          path: admission-initializer-result.jsonl
          if-no-files-found: warn
          retention-days: 7
