name: Admission Initializer upgrade integration

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  initializer-upgrade:
    name: Initializer (${{ matrix.scenario }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        scenario: [upgrade, fresh, operational]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch only the fixed content baselines
        run: |
          git fetch --no-tags --depth=1 origin \
            8000b27f48bf124fe9a553d4ba41c678e9acc231 \
            57690d4e976ef6d97a925c68103d532d10ee15cf
      - name: Test the harness isolation and assertions without Docker
        run: python3 -B .github/integration/admission-initializer/test_harness.py
      - name: Exercise the pinned backend with exclusively synthetic data
        env:
          ADMISSION_INITIALIZER_DISPOSABLE: github-runner-only
          ADMISSION_INITIALIZER_SCENARIO: ${{ matrix.scenario }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B .github/integration/admission-initializer/harness.py \
            | tee admission-initializer-result.jsonl
      - name: Record validation boundaries
        if: always()
        run: |
          {
            echo '## Admission Initializer ${{ matrix.scenario }} integration'
            echo "Source: ${GITHUB_SHA}"
            echo 'Pinned backend digest; owned ephemeral MariaDB/backend only.'
            echo 'See sanitized phase results for actual completion and assertions.'
            echo 'No DEV/QLTY/PROD access, existing accounts, live patients, or deployments.'
            echo 'A narrow synthetic role/relationship smoke is not general clinical acceptance.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve only sanitized phase results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admission-initializer-${{ matrix.scenario }}-${{ github.sha }}
          path: admission-initializer-result.jsonl
          if-no-files-found: warn
          retention-days: 7
